name: CI HLS Prefetch Cache

on:
  push:
    branches:
      - perf/hls-prefetch-cache

permissions:
  contents: read

jobs:
  build_android_ics:
    name: Compile Android 4.0.4 API 15 APK
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /tmp/android-sdk-legacy
      ANDROID_SDK_ROOT: /tmp/android-sdk-legacy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install isolated legacy Android SDK
        run: |
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-25" "build-tools;26.0.2"
          find "$ANDROID_HOME" -maxdepth 2 -type d | sort

      - name: Set up JDK 8 for legacy Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "4.1"

      - name: Build legacy debug APK
        run: gradle -p legacy-android-ics :app:assembleDebug --stacktrace
