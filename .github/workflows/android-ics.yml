name: Build Android 4.0.4 Legacy APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: "Create GitHub release after successful build"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - build/android-ics-20261004

permissions:
  contents: write

jobs:
  build_android_ics:
    name: Build Android 4.0.4 API 15 APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Install legacy Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-25" "build-tools;26.0.2"

      - name: Set up JDK 8 for legacy Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Set up Gradle 4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "4.1"

      - name: Get version from package.json
        id: package-version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve build type
        id: build-type
        shell: bash
        run: |
          build_type="${{ inputs.build_type }}"
          if [ -z "$build_type" ]; then
            build_type="release"
          fi
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"

      - name: Cache stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: oriontv-legacy-debug-keystore-v1

      - name: Ensure debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build legacy APK
        run: |
          if [ "${{ steps.build-type.outputs.build_type }}" = "release" ]; then
            gradle -p legacy-android-ics :app:assembleRelease
          else
            gradle -p legacy-android-ics :app:assembleDebug
          fi

      - name: Rename APK
        run: |
          mkdir -p artifacts
          apk=$(find legacy-android-ics/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No APK found under legacy-android-ics/app/build/outputs/apk"
            find legacy-android-ics/app/build/outputs -maxdepth 5 -type f || true
            exit 1
          fi
          if [ "${{ steps.build-type.outputs.build_type }}" = "release" ]; then
            cp "$apk" artifacts/orionTV.${{ steps.package-version.outputs.version }}-android-ics-release.apk
          else
            cp "$apk" artifacts/orionTV.${{ steps.package-version.outputs.version }}-android-ics-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orionTV-${{ steps.package-version.outputs.version }}-android-ics-${{ steps.build-type.outputs.build_type }}
          path: artifacts/*.apk

      - name: Create Release and Upload APK
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}-android-ics
          name: Release v${{ steps.package-version.outputs.version }} (Android 4.0.4)
          body: |
            Android 4.0.4 / API 15 legacy native client.

            This APK is built from `legacy-android-ics/` and is separate from the Expo/React Native Android 5+ app.
          draft: false
          prerelease: true
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
