name: Build PR23 Legacy APK

on:
  push:
    branches:
      - build/pr23-1.0.25-test
    paths:
      - 'legacy-android-ics/**'
      - '.github/workflows/build-pr23-legacy-apk.yml'
  pull_request:
    branches:
      - ci/pr23-build-base
    paths:
      - 'legacy-android-ics/**'
      - '.github/workflows/build-pr23-legacy-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 25 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-25" "build-tools;26.0.2"

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.1'

      - name: Prepare signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ORIONTV_LEGACY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORIONTV_LEGACY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORIONTV_LEGACY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORIONTV_LEGACY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oriontv-legacy.jks"
            echo "ORIONTV_LEGACY_KEYSTORE=$RUNNER_TEMP/oriontv-legacy.jks" >> "$GITHUB_ENV"
            echo "ORIONTV_LEGACY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORIONTV_LEGACY_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORIONTV_LEGACY_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "mode=repository-secret" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
            fi
            echo "mode=generated-debug" >> "$GITHUB_OUTPUT"
          fi
          echo "Signing mode prepared."

      - name: Run HLS filter tests
        working-directory: legacy-android-ics
        run: gradle --no-daemon test

      - name: Build release APK
        working-directory: legacy-android-ics
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          cp legacy-android-ics/app/build/outputs/apk/release/app-release.apk \
             OrionTV-Legacy-1.0.25-pr23-midroll-test.apk
          sha256sum OrionTV-Legacy-1.0.25-pr23-midroll-test.apk > apk-sha256.txt
          echo "signing_mode=${{ steps.signing.outputs.mode }}" > build-info.txt
          echo "source_branch=build/pr23-1.0.25-test" >> build-info.txt
          echo "main_with_pr22=2d0e44fb89557ab9929c7131264115b94e79d097" >> build-info.txt
          echo "pr23_head=79640ce88a4a20d20b64cd1262005448a7fdee8f" >> build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-Legacy-1.0.25-pr23-midroll-test
          path: |
            OrionTV-Legacy-1.0.25-pr23-midroll-test.apk
            apk-sha256.txt
            build-info.txt
          if-no-files-found: error
          retention-days: 7
